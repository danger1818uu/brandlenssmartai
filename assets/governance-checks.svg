gin="0.7s" repeatCount="indefinite"/></circle><circle cx="643" cy="67" r="0.8" fill="#9edfff" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="4s" begin="2.7s" repeatCount="indefinite"/></circle><circle cx="813" cy="60" r="0.8" fill="#8ce6d2" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="800" cy="56" r="1.8" fill="#a995ff" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" begin="3.0s" repeatCount="indefinite"/></circle><circle cx="463" cy="172" r="1" fill="#9edfff" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="529" cy="132" r="1.3" fill="#8ce6d2" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="3s" begin="3.4s" repeatCount="indefinite"/></circle><circle cx="436" cy="68" r="1.8" fill="#ffffff" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle><circle cx="448" cy="43" r="1" fill="#9edfff" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="3s" begin="3.1s" repeatCount="indefinite"/></circle><circle cx="743" cy="335" r="1.3" fill="#8ce6d2" opacity=".3"><animate attributeName="opacity" values=".15;1;.15" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle><text x="36" y="52" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#ecefff">Nova Unlimited Governance Check</text><text x="36" y="73" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#a9adcb">ILLUSTRATIVE EXAMPLE · EMPLOYEE DRAFT FOR LINKEDIN</text><rect x="665" y="36" width="199" height="22" rx="11" fill="none" stroke="#fca5a5"/><text x="764.5" y="51" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#fca5a5">BLOCKED · NEEDS ATTENTION</text><rect x="36" y="96" width="400" height="106" rx="12" fill="#141833" stroke="#262b52"/><rect x="36" y="114" width="3" height="70" fill="#86efac"/><text x="56" y="128" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#a9adcb">A · COMPANY RELEVANCE</text><rect x="368" y="110" width="52" height="22" rx="11" fill="none" stroke="#86efac"/><text x="394.0" y="125" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#86efac">PASS</text><text x="56" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">Servers fit Nova Unlimited’s hosting business.</text><text x="56" y="180" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">The topic belongs in the conversation.</text><rect x="464" y="96" width="400" height="106" rx="12" fill="#141833" stroke="#262b52"/><rect x="464" y="114" width="3" height="70" fill="#fca5a5"/><text x="484" y="128" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#a9adcb">B · ROLE SCOPE</text><rect x="726" y="110" width="122" height="22" rx="11" fill="none" stroke="#fca5a5"/><text x="787.0" y="125" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#fca5a5">SCOPE MISMATCH</text><text x="484" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">An employee can’t commit to “100% free” terms</text><text x="484" y="180" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">without administrator sign-off.</text><rect x="36" y="216" width="400" height="106" rx="12" fill="#141833" stroke="#262b52"/><rect x="36" y="234" width="3" height="70" fill="#fca5a5"/><text x="56" y="248" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#a9adcb">C · PLATFORM SUITABILITY</text><rect x="291" y="230" width="129" height="22" rx="11" fill="none" stroke="#fca5a5"/><text x="355.5" y="245" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#fca5a5">FORMAT MISMATCH</text><text x="56" y="280" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">Casual wording falls below the precise tone</text><text x="56" y="300" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">expected for a B2B LinkedIn post.</text><rect x="464" y="216" width="400" height="106" rx="12" fill="#141833" stroke="#262b52"/><rect x="464" y="234" width="3" height="70" fill="#fcd34d"/><text x="484" y="248" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="1" fill="#a9adcb">D · FACTUAL INTEGRITY</text><rect x="740" y="230" width="108" height="22" rx="11" fill="none" stroke="#fcd34d"/><text x="794.0" y="245" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" fill="#fcd34d">NEEDS VERIFY</text><text x="484" y="280" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">An absolute free-server claim must be checked</text><text x="484" y="300" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#ecefff">against official pricing. It can’t be assumed true.</text><text x="450" y="354" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a9adcb">Sample claim for demonstration only. Not a statement about real offers.</text></svg>